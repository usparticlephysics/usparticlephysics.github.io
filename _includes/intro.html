<section class='{{ include.class | default: "res-intro" }}'>
	<div class="grid-wrapper">
		<div class='{{ include.class | default: "res-intro" }}-text'>
			{%- if page.label %}
			<small>{{ page.label }}</small>
			<br /><br />
			{%- endif %}
			<h1>{{ page.title }}</h1>
			{% if page.intro == "" %}<p></p>{% else %}{{ page.intro | markdownify }}{% endif %}
		</div>
	</div>
</section>
