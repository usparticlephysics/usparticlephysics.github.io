<section class='{{ include.class }}'>
	<ul>
		{%- for tile in include.tiles %}
		<li>
			<div class='img-sixteen-nine'>
				<div class='img-content'>
					<img src='{{ tile.image | relative_url }}' />
				</div>
			</div>
			<a href='{{ tile.url | relative_url }}'>
				{{ tile.title }}
			</a>
			<div class='border-thin'></div>
		</li>
		{%- endfor %}
	</ul>
</section>
