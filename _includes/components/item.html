<div class='border-thin'>&nbsp;</div>
<div class='comp-accordion-li'>
<div class='accordion-li-head'>
<img class='head-icon' src='{{ "/wp-content/themes/USPP/img/open_icon.svg" | relative_url }}' />
<h2 class='head-title'>{{ component.title }}</h2>
<div class='head-title-img'>
<img src='{{ component.title_img }}' />
</div>
</div>
<div class='accordion-li-drawer'>
<div class='drawer-img'>
<div class='img-content'>
<img src='{{ component.img | relative_url }}' />
</div>
</div>
<div class='drawer-text'>
<p class='drawer-p'>{{ component.content }}</p>
<p class='drawer-close'>Close</p>
</div>
</div>
</div>
