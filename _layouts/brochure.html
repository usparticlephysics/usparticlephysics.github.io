---
layout: wp
---
<section id="content" role="main">
<div class='content-wrapper'>
	<div class="grid-wrapper">
		<section class='broch-hero'>
			<div class='broch-heroimg'>
				<div class='img-sixteen-nine'>
					<div class='img-content'>
						<div class='img-overlay'>&nbsp;</div>
						<img src='{{ page.hero_image | relative_url }}' />
					</div>
				</div>
			</div>
			<section class='broch-intro'>
				<h1>{{ page.title }}</h1>
				{%- if page.subtitle %}
				<h2>{{ page.subtitle }}</h2>
				{%- endif %}
				{% if page.intro == "" %}<p></p>{% else %}{{ page.intro | markdownify }}{% endif %}
			</section>
		</section>
		<section class='broch-content'>
{{ content }}
		</section>
	</div>
</div>
</section>
